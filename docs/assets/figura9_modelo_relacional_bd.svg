<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 450" width="100%" height="100%">
  <rect width="1000" height="450" fill="#f8f9fa"/>

  <text x="500" y="35" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#78350f">
    Figura 1: Nombre de tablas del Modelo de Base de Datos Relacional (Propuesta Final - Anexo 1)
  </text>
  <text x="500" y="60" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">
    Mapeo entidad-relación implementado en MySQL (milsaboresbd) mediante Spring Data JPA e Hibernate
  </text>

  <!-- 1. Tabla USUARIO -->
  <rect x="30" y="110" width="165" height="230" rx="6" fill="#ffffff" stroke="#0d6efd" stroke-width="2"/>
  <rect x="30" y="110" width="165" height="35" rx="6" fill="#0d6efd"/>
  <text x="112" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">USUARIO</text>
  <text x="40" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0d6efd">PK id (BIGINT)</text>
  <text x="40" y="185" font-family="Arial, sans-serif" font-size="11" fill="#212529">nombre (VARCHAR)</text>
  <text x="40" y="205" font-family="Arial, sans-serif" font-size="11" fill="#212529">correo (VARCHAR, UK)</text>
  <text x="40" y="225" font-family="Arial, sans-serif" font-size="11" fill="#212529">password (BCRYPT)</text>
  <text x="40" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc3545">rol (VARCHAR)</text>
  <text x="40" y="265" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">ADMIN/VEND/CLIENT</text>
  <text x="40" y="285" font-family="Arial, sans-serif" font-size="11" fill="#212529">fechaNacimiento</text>
  <text x="40" y="305" font-family="Arial, sans-serif" font-size="11" fill="#212529">beneficios (LIST)</text>

  <!-- Flecha 1: USUARIO -> BOLETA -->
  <line x1="195" y1="210" x2="225" y2="210" stroke="#495057" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="225,205 235,210 225,215" fill="#495057"/>
  <text x="210" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">1 : N</text>

  <!-- 2. Tabla BOLETA -->
  <rect x="235" y="110" width="165" height="230" rx="6" fill="#ffffff" stroke="#198754" stroke-width="2"/>
  <rect x="235" y="110" width="165" height="35" rx="6" fill="#198754"/>
  <text x="317" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">BOLETA</text>
  <text x="245" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#198754">PK id (BIGINT)</text>
  <text x="245" y="185" font-family="Arial, sans-serif" font-size="11" fill="#212529">clienteNombre</text>
  <text x="245" y="205" font-family="Arial, sans-serif" font-size="11" fill="#212529">clienteCorreo</text>
  <text x="245" y="225" font-family="Arial, sans-serif" font-size="11" fill="#212529">direccionCalle</text>
  <text x="245" y="245" font-family="Arial, sans-serif" font-size="11" fill="#212529">direccionComuna</text>
  <text x="245" y="265" font-family="Arial, sans-serif" font-size="11" fill="#212529">subtotal (DOUBLE)</text>
  <text x="245" y="285" font-family="Arial, sans-serif" font-size="11" fill="#dc3545">descuento (DOUBLE)</text>
  <text x="245" y="305" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#198754">total (DOUBLE)</text>
  <text x="245" y="325" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">fecha (DATETIME)</text>

  <!-- Flecha 2: BOLETA -> DETALLE_BOLETA -->
  <line x1="400" y1="210" x2="430" y2="210" stroke="#495057" stroke-width="2"/>
  <polygon points="430,205 440,210 430,215" fill="#495057"/>
  <text x="420" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">1 : N</text>

  <!-- 3. Tabla DETALLE_BOLETA -->
  <rect x="440" y="110" width="165" height="230" rx="6" fill="#ffffff" stroke="#0dcaf0" stroke-width="2"/>
  <rect x="440" y="110" width="165" height="35" rx="6" fill="#0dcaf0"/>
  <text x="522" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">DETALLE_BOLETA</text>
  <text x="450" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#055160">FK boleta_id</text>
  <text x="450" y="195" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#055160">FK productoId</text>
  <text x="450" y="225" font-family="Arial, sans-serif" font-size="11" fill="#212529">nombre (VARCHAR)</text>
  <text x="450" y="255" font-family="Arial, sans-serif" font-size="11" fill="#212529">precio (DOUBLE)</text>
  <text x="450" y="285" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#212529">cantidad (INT)</text>
  <text x="450" y="315" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">subtotal (DOUBLE)</text>

  <!-- Flecha 3: DETALLE_BOLETA -> PRODUCTO -->
  <line x1="605" y1="210" x2="635" y2="210" stroke="#495057" stroke-width="2"/>
  <polygon points="635,205 645,210 635,215" fill="#495057"/>
  <text x="625" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">N : 1</text>

  <!-- 4. Tabla PRODUCTO -->
  <rect x="645" y="110" width="165" height="230" rx="6" fill="#ffffff" stroke="#6f42c1" stroke-width="2"/>
  <rect x="645" y="110" width="165" height="35" rx="6" fill="#6f42c1"/>
  <text x="727" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">PRODUCTO</text>
  <text x="655" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6f42c1">PK id (BIGINT)</text>
  <text x="655" y="185" font-family="Arial, sans-serif" font-size="11" fill="#212529">nombre (VARCHAR)</text>
  <text x="655" y="205" font-family="Arial, sans-serif" font-size="11" fill="#212529">categoria (VARCHAR)</text>
  <text x="655" y="225" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#198754">precio (DOUBLE)</text>
  <text x="655" y="245" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#dc3545">stock (INT)</text>
  <text x="655" y="265" font-family="Arial, sans-serif" font-size="11" fill="#212529">descripcion (TEXT)</text>
  <text x="655" y="285" font-family="Arial, sans-serif" font-size="11" fill="#212529">imagen (TEXT)</text>
  <text x="655" y="305" font-family="Arial, sans-serif" font-size="11" fill="#212529">enOferta (BOOLEAN)</text>
  <text x="655" y="325" font-family="Arial, sans-serif" font-size="11" fill="#212529">descuento (DOUBLE)</text>

  <!-- Flecha 4: PRODUCTO -> CATEGORIA -->
  <line x1="810" y1="210" x2="840" y2="210" stroke="#495057" stroke-width="2"/>
  <polygon points="840,205 850,210 840,215" fill="#495057"/>
  <text x="830" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#6c757d">N : 1</text>

  <!-- 5. Tabla CATEGORIA -->
  <rect x="850" y="110" width="130" height="230" rx="6" fill="#ffffff" stroke="#fd7e14" stroke-width="2"/>
  <rect x="850" y="110" width="130" height="35" rx="6" fill="#fd7e14"/>
  <text x="915" y="133" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">CATEGORIA</text>
  <text x="860" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fd7e14">PK id (BIGINT)</text>
  <text x="860" y="200" font-family="Arial, sans-serif" font-size="11" fill="#212529">nombre (UK)</text>
  <text x="860" y="240" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">descripcion (TEXT)</text>

  <!-- Resumen al Pie -->
  <rect x="30" y="365" width="950" height="60" rx="6" fill="#e9ecef"/>
  <text x="50" y="390" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    <strong>Integridad Referencial:</strong> La boleta registra el desglose de productos mediante líneas en detalle_boleta con claves foráneas.
  </text>
  <text x="50" y="410" font-family="Arial, sans-serif" font-size="12" fill="#495057">
    El stock se actualiza transaccionalmente al emitir la boleta garantizando que no se sobre-vendan unidades físicas.
  </text>
</svg>

