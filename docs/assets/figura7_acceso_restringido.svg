<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="850" height="480" fill="#f8f9fa"/>

  <!-- Barra Superior -->
  <rect x="0" y="0" width="850" height="50" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="32" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#78350f">🍰 Pastelería Mil Sabores</text>
  <text x="650" y="32" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">👤 Juan (Cliente) | <span style="color:#dc3545">Sesión Activa</span></text>

  <!-- Tarjeta de Error 403 -->
  <rect x="175" y="100" width="500" height="290" rx="10" fill="#ffffff" stroke="#f5c2c7" stroke-width="1.5" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.05))"/>

  <rect x="175" y="100" width="500" height="60" rx="10" fill="#f8d7da"/>
  <circle cx="215" cy="130" r="16" fill="#dc3545"/>
  <text x="210" y="137" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">✕</text>
  <text x="245" y="137" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#842029">HTTP 403 - Acceso Denegado / Restringido</text>

  <!-- Mensaje Descriptivo -->
  <text x="215" y="195" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#212529">Funcionalidad Restringida por Rol de Usuario</text>
  <text x="215" y="225" font-family="Arial, sans-serif" font-size="12" fill="#495057">Has intentado ingresar a una sección protegida del sistema (Dashboard / Administración).</text>
  <text x="215" y="245" font-family="Arial, sans-serif" font-size="12" fill="#495057">Tu cuenta actual tiene asignado el rol <strong>CLIENTE</strong>, el cual únicamente tiene permisos</text>
  <text x="215" y="265" font-family="Arial, sans-serif" font-size="12" fill="#495057">para explorar el catálogo de la tienda, gestionar tu carrito y emitir tus compras.</text>

  <!-- Botones de Acción -->
  <rect x="215" y="305" width="200" height="38" rx="6" fill="#0d6efd"/>
  <text x="315" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Volver al Inicio de la Tienda</text>

  <rect x="430" y="305" width="200" height="38" rx="6" fill="none" stroke="#6c757d" stroke-width="1"/>
  <text x="530" y="329" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#495057">Cambiar de Cuenta</text>
</svg>

