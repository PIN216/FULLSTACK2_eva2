<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <rect width="1000" height="600" fill="#f8f9fa"/>

  <!-- Barra de Navegación -->
  <rect x="0" y="0" width="1000" height="60" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#78350f">🍰 Pastelería Mil Sabores</text>
  <text x="280" y="38" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#78350f">Inicio</text>
  <text x="340" y="38" font-family="Arial, sans-serif" font-size="14" fill="#495057">Categorías</text>
  <text x="440" y="38" font-family="Arial, sans-serif" font-size="14" fill="#495057">Ofertas</text>
  <text x="515" y="38" font-family="Arial, sans-serif" font-size="14" fill="#495057">Nosotros</text>
  <text x="595" y="38" font-family="Arial, sans-serif" font-size="14" fill="#495057">Contacto</text>

  <!-- Carrito y Sesión Cliente -->
  <rect x="700" y="15" width="150" height="32" rx="16" fill="#198754"/>
  <text x="715" y="36" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#ffffff">🛒 Carrito (3)  $87.900</text>
  <text x="870" y="36" font-family="Arial, sans-serif" font-size="13" fill="#495057">👤 Juan (Cliente)</text>

  <!-- Hero Banner -->
  <rect x="40" y="80" width="920" height="110" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1"/>
  <text x="70" y="120" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#78350f">Tradición Casera y Recetas Artesanales</text>
  <text x="70" y="150" font-family="Arial, sans-serif" font-size="14" fill="#92400e">Descuento especial de 50% para mayores de 50 años y 10% adicional con cupón FELICES50</text>

  <!-- Catálogo de Productos (4 Cards) -->
  <text x="40" y="225" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#212529">Nuestras Especialidades Destacadas</text>

  <!-- Card 1 -->
  <rect x="40" y="245" width="215" height="320" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="40" y="245" width="215" height="130" rx="8" fill="#854d0e"/>
  <text x="147" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">🎂 Foto Chocolate</text>
  <text x="55" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#212529">Torta Cuadrada Choc.</text>
  <text x="55" y="415" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Ganache de avellanas</text>
  <text x="55" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#198754">$45.000</text>
  <rect x="55" y="465" width="185" height="32" rx="4" fill="#854d0e"/>
  <text x="147" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Añadir al Carrito</text>

  <!-- Card 2 (Oferta) -->
  <rect x="275" y="245" width="215" height="320" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="275" y="245" width="215" height="130" rx="8" fill="#ea580c"/>
  <text x="382" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">🎂 Foto Manjar</text>
  <rect x="285" y="255" width="85" height="22" rx="4" fill="#dc3545"/>
  <text x="327" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">15% DCTO</text>
  <text x="290" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#212529">Torta Circular Manjar</text>
  <text x="290" y="415" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Manjar casero y nuez</text>
  <text x="290" y="440" font-family="Arial, sans-serif" font-size="12" text-decoration="line-through" fill="#6c757d">$42.000</text>
  <text x="345" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc3545">$35.700</text>
  <rect x="290" y="465" width="185" height="32" rx="4" fill="#854d0e"/>
  <text x="382" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Añadir al Carrito</text>

  <!-- Card 3 -->
  <rect x="510" y="245" width="215" height="320" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="510" y="245" width="215" height="130" rx="8" fill="#ca8a04"/>
  <text x="617" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">🍰 Foto Cheesecake</text>
  <text x="525" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#212529">Cheesecake Sin Azúcar</text>
  <text x="525" y="415" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">100% endulzado natural</text>
  <text x="525" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#198754">$47.000</text>
  <rect x="525" y="465" width="185" height="32" rx="4" fill="#854d0e"/>
  <text x="617" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Añadir al Carrito</text>

  <!-- Card 4 (Oferta) -->
  <rect x="745" y="245" width="215" height="320" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <rect x="745" y="245" width="215" height="130" rx="8" fill="#166534"/>
  <text x="852" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#ffffff">🍫 Foto Brownie</text>
  <rect x="755" y="255" width="85" height="22" rx="4" fill="#dc3545"/>
  <text x="797" y="270" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">10% DCTO</text>
  <text x="760" y="395" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#212529">Brownie Sin Gluten</text>
  <text x="760" y="415" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Apto para celíacos</text>
  <text x="760" y="440" font-family="Arial, sans-serif" font-size="12" text-decoration="line-through" fill="#6c757d">$4.000</text>
  <text x="815" y="445" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#dc3545">$3.600</text>
  <rect x="760" y="465" width="185" height="32" rx="4" fill="#854d0e"/>
  <text x="852" y="486" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">+ Añadir al Carrito</text>
</svg>

