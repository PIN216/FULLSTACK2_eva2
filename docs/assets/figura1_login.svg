<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 550" width="100%" height="100%">
  <rect width="900" height="550" fill="#f8f9fa"/>
  <!-- Barra de Navegación -->
  <rect x="0" y="0" width="900" height="60" fill="#ffffff" stroke="#dee2e6" stroke-width="1"/>
  <text x="30" y="38" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#78350f">🍰 Pastelería Mil Sabores</text>
  <rect x="730" y="15" width="70" height="30" rx="4" fill="none" stroke="#0d6efd" stroke-width="1.5"/>
  <text x="742" y="35" font-family="Arial, sans-serif" font-size="12" fill="#0d6efd">Ingresar</text>
  <rect x="810" y="15" width="80" height="30" rx="4" fill="#0d6efd"/>
  <text x="822" y="35" font-family="Arial, sans-serif" font-size="12" fill="#ffffff">Registrarse</text>

  <!-- Tarjeta de Login Centrada -->
  <rect x="250" y="90" width="400" height="430" rx="10" fill="#ffffff" stroke="#ced4da" stroke-width="1" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.1))"/>
  <text x="450" y="135" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#78350f">🍰 Iniciar Sesión</text>
  <text x="450" y="160" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#6c757d">Acceso seguro con autenticación JWT</text>

  <!-- Formulario -->
  <text x="280" y="195" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#212529">Correo Electrónico</text>
  <rect x="280" y="205" width="340" height="36" rx="5" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="295" y="228" font-family="Arial, sans-serif" font-size="13" fill="#495057">admin@milsabores.cl</text>

  <text x="280" y="265" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#212529">Contraseña</text>
  <rect x="280" y="275" width="340" height="36" rx="5" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="295" y="298" font-family="Arial, sans-serif" font-size="13" fill="#495057">••••••••••••</text>

  <!-- Botón Ingresar -->
  <rect x="280" y="325" width="340" height="40" rx="6" fill="#854d0e"/>
  <text x="450" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Ingresar a la Plataforma</text>

  <!-- Demo Roles -->
  <line x1="280" y1="380" x2="620" y2="380" stroke="#e9ecef" stroke-width="1"/>
  <text x="450" y="398" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#6c757d">Accesos Rápidos por Rol (Evaluación 3):</text>
  
  <rect x="280" y="410" width="105" height="26" rx="4" fill="#fee2e2" stroke="#ef4444" stroke-width="1"/>
  <text x="332" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Admin</text>

  <rect x="397" y="410" width="105" height="26" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <text x="449" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#0369a1">Vendedor</text>

  <rect x="515" y="410" width="105" height="26" rx="4" fill="#dcfce7" stroke="#22c55e" stroke-width="1"/>
  <text x="567" y="427" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#15803d">Cliente</text>

  <text x="450" y="460" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#6c757d">Contraseña universal demo: Admin1234 / Vendedor1234 / Cliente1234</text>
  <rect x="0" y="540" width="900" height="10" fill="#854d0e"/>
</svg>

