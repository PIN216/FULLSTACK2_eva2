# ====================================================================
# Configuración del Servidor y Puerto (Pastelería Mil Sabores)
# ====================================================================
server.port=9091

# ====================================================================
# Configuración de Base de Datos (MySQL 8.0 con fallback automático a H2)
# ====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/milsaboresbd?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}

# ====================================================================
# Configuración de Hibernate / JPA
# ====================================================================
# Actualiza el esquema de tablas automáticamente al iniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ====================================================================
# Inicialización de Datos
# La carga inicial idempotente se realiza mediante DatosIniciales.java
# ====================================================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=never
spring.sql.init.continue-on-error=true

# ====================================================================
# Consola H2 para depuración (disponible si H2 está activo)
# ====================================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ====================================================================
# Configuración de Seguridad y Tokens JWT
# ====================================================================
app.jwt.secret=claveSecretaUltraSeguraPasteleriaMilSaboresEvaluacion3DuocUC2026FullstackII
app.jwt.expiration-ms=86400000
