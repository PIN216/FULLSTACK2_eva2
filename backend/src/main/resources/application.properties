server.port=9091

# Base de datos SQL (H2) en memoria: se reinicia y se vuelve a cargar con DataLoader cada vez que arrancas el backend.
# Para que los datos sobrevivan entre reinicios usa un archivo:
#   spring.datasource.url=jdbc:h2:file:./data/milsaboresdb;DB_CLOSE_DELAY=-1
spring.datasource.url=jdbc:h2:mem:milsaboresdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Contraseña inicial del usuario administrador (admin@milsabores.cl). Se guarda cifrada con BCrypt.
app.admin.password=Admin1234
