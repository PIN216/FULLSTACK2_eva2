# ====================================================================
# Configuración del Servidor y Puerto
# ====================================================================
server.port=9091

# ====================================================================
# Configuración de Base de Datos MySQL
# ====================================================================
spring.datasource.url=jdbc:mysql://localhost:3306/milsaboresbd?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=

# ====================================================================
# Configuración de Hibernate / JPA
# ====================================================================
# Actualiza el esquema de tablas automáticamente sin borrar datos existentes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.generate-ddl=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.show-sql=false

# ====================================================================
# Inicialización de Datos SQL
# ====================================================================
# Pospone la inicialización de scripts hasta que Hibernate haya creado las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
